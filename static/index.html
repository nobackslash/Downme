<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Downme</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e0f13;
      --card: #171920;
      --border: #262935;
      --text: #eceef4;
      --muted: #8b90a0;
      --accent: #ff3d57;
      --accent-2: #ff7a45;
      --ok: #34d399;
      --err: #f87171;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 50% -200px, #2a1520 0%, var(--bg) 60%);
      color: var(--text);
      display: flex; justify-content: center; padding: 64px 16px;
    }
    main { width: 100%; max-width: 640px; }
    header { text-align: center; margin-bottom: 36px; }
    .logo {
      font-size: 42px; font-weight: 700; letter-spacing: -1.5px; margin: 0;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    header p { color: var(--muted); margin: 8px 0 0; }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
    }
    form { display: flex; gap: 10px; }
    input[type=url] {
      flex: 1; min-width: 0; padding: 14px 16px; border-radius: 12px;
      border: 1px solid var(--border); background: #0f1116; color: var(--text);
      font: inherit; outline: none; transition: border-color .15s;
    }
    input[type=url]:focus { border-color: var(--accent); }
    button {
      font: inherit; font-weight: 600; cursor: pointer; border: 0;
      border-radius: 12px; padding: 14px 20px; color: #fff;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: opacity .15s, transform .05s;
    }
    button:hover { opacity: .92; }
    button:active { transform: scale(.98); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }

    .msg { margin-top: 14px; font-size: 14px; color: var(--err); min-height: 1em; }

    #result { display: none; margin-top: 20px; }
    .video { display: flex; gap: 16px; }
    .thumb {
      width: 200px; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px;
      background: #0f1116; flex-shrink: 0;
    }
    .meta h2 { font-size: 17px; margin: 0 0 6px; line-height: 1.35; }
    .meta p { margin: 0; color: var(--muted); font-size: 14px; }

    .options { margin-top: 20px; display: grid; gap: 14px; }
    .label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .seg { display: flex; flex-wrap: wrap; gap: 8px; }
    .seg button {
      background: #0f1116; border: 1px solid var(--border); color: var(--text);
      padding: 9px 14px; font-weight: 500; font-size: 14px;
    }
    .seg button.active { border-color: var(--accent); background: #2a1520; }

    #go { width: 100%; margin-top: 4px; }

    .progress { display: none; margin-top: 18px; }
    .bar { height: 8px; background: #0f1116; border-radius: 99px; overflow: hidden; }
    .bar > div {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width .3s;
    }
    .bar.indeterminate > div { width: 40%; animation: slide 1.2s infinite ease-in-out; }
    @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
    .progress-info { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 8px; }
    .done { color: var(--ok); }

    .saved {
      display: none; margin-top: 16px; padding: 14px 16px; border-radius: 12px;
      background: rgba(52, 211, 153, .08); border: 1px solid rgba(52, 211, 153, .3);
    }
    .saved p { margin: 0 0 12px; font-size: 14px; word-break: break-all; }
    .saved p strong { color: var(--ok); font-weight: 600; }
    .saved-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .saved-actions button { padding: 9px 14px; font-size: 14px; }

    footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; line-height: 1.6; }
    .signature { margin-top: 10px; font-size: 13px; color: var(--text); opacity: .7; }

    .spinner {
      display: inline-block; width: 14px; height: 14px; vertical-align: -2px;
      border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 560px) {
      body { padding: 32px 16px; }
      form { flex-direction: column; }
      .video { flex-direction: column; }
      .thumb { width: 100%; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1 class="logo">Downme</h1>
    <p>Cole o link do YouTube e baixe em vídeo ou MP3.</p>
  </header>

  <section class="card">
    <form id="search">
      <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." required autocomplete="off">
      <button id="searchBtn" type="submit">Buscar</button>
    </form>
    <div class="msg" id="msg"></div>

    <div id="result">
      <div class="video">
        <img class="thumb" id="thumb" alt="">
        <div class="meta">
          <h2 id="title"></h2>
          <p id="sub"></p>
        </div>
      </div>

      <div class="options">
        <div>
          <div class="label">Formato</div>
          <div class="seg" id="kind">
            <button type="button" data-kind="video" class="active">Vídeo (MP4)</button>
            <button type="button" data-kind="audio">Só áudio (MP3)</button>
          </div>
        </div>
        <div id="qualityWrap">
          <div class="label">Qualidade</div>
          <div class="seg" id="quality"></div>
        </div>
        <button id="go" type="button">Baixar</button>
      </div>

      <div class="progress" id="progress">
        <div class="bar" id="bar"><div></div></div>
        <div class="progress-info">
          <span id="phase">Preparando…</span>
          <span id="pct"></span>
        </div>
      </div>

      <div class="saved" id="saved">
        <p><strong>Salvo!</strong> <span id="savedName"></span></p>
        <div class="saved-actions">
          <button type="button" id="openFile">Abrir</button>
          <button type="button" class="ghost" id="openFolder">Mostrar na pasta</button>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <span id="saveDir"></span>
    Uso pessoal. Baixe apenas vídeos seus, de domínio público ou com permissão do autor.
    <div class="signature">do italico</div>
  </footer>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const state = { url: null, kind: "video", quality: null, polling: null, desktop: false, jobId: null };

  // No app desktop os arquivos vão direto para uma pasta; no site, o navegador baixa.
  fetch("/api/config").then((r) => r.json()).then((cfg) => {
    state.desktop = !!cfg.desktop;
    if (cfg.save_dir) $("saveDir").innerHTML = `Arquivos salvos em <b>${cfg.save_dir.replace(/</g, "&lt;")}</b><br>`;
  }).catch(() => {});

  async function openResult(what) {
    try { await api(`/api/open/${state.jobId}`, { what }); }
    catch (err) { showError(err.message); }
  }
  $("openFile").addEventListener("click", () => openResult("file"));
  $("openFolder").addEventListener("click", () => openResult("folder"));

  function fmtDuration(s) {
    if (!s) return "";
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
    const mm = String(m).padStart(h ? 2 : 1, "0"), ss = String(sec).padStart(2, "0");
    return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
  }
  function fmtSpeed(b) {
    if (!b) return "";
    return b > 1048576 ? (b / 1048576).toFixed(1) + " MB/s" : (b / 1024).toFixed(0) + " KB/s";
  }
  function showError(text) { $("msg").textContent = text || ""; }

  async function api(path, body) {
    const res = await fetch(path, body ? {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    } : undefined);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Erro inesperado.");
    return data;
  }

  $("search").addEventListener("submit", async (e) => {
    e.preventDefault();
    showError("");
    const btn = $("searchBtn");
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
    $("result").style.display = "none";
    try {
      const url = $("url").value.trim();
      const info = await api("/api/info", { url });
      state.url = url;
      renderInfo(info);
    } catch (err) {
      showError(err.message);
    } finally {
      btn.disabled = false; btn.textContent = "Buscar";
    }
  });

  function renderInfo(info) {
    $("thumb").src = info.thumbnail || "";
    $("title").textContent = info.title || "Sem título";
    $("sub").textContent = [info.channel, fmtDuration(info.duration)].filter(Boolean).join(" · ");

    const q = $("quality");
    q.innerHTML = "";
    const list = info.qualities.length ? info.qualities : [null];
    list.forEach((h, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = h ? `${h}p` : "Melhor";
      b.dataset.q = h ?? "";
      if (i === 0) { b.classList.add("active"); state.quality = h; }
      q.appendChild(b);
    });

    $("progress").style.display = "none";
    $("saved").style.display = "none";
    $("go").disabled = false;
    $("go").textContent = "Baixar";
    $("result").style.display = "block";
  }

  $("kind").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    [...$("kind").children].forEach((x) => x.classList.toggle("active", x === b));
    state.kind = b.dataset.kind;
    $("qualityWrap").style.display = state.kind === "audio" ? "none" : "";
  });

  $("quality").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    [...$("quality").children].forEach((x) => x.classList.toggle("active", x === b));
    state.quality = b.dataset.q ? Number(b.dataset.q) : null;
  });

  $("go").addEventListener("click", async () => {
    showError("");
    $("go").disabled = true;
    $("saved").style.display = "none";
    $("progress").style.display = "block";
    setProgress({ phase: "Preparando…", percent: 0 });
    try {
      const { job_id } = await api("/api/download", {
        url: state.url, kind: state.kind, quality: state.quality,
      });
      poll(job_id);
    } catch (err) {
      showError(err.message);
      $("go").disabled = false;
      $("progress").style.display = "none";
    }
  });

  function setProgress(job) {
    const bar = $("bar");
    const indeterminate = job.status === "processing" || job.status === "queued" || !job.percent;
    bar.classList.toggle("indeterminate", indeterminate && job.status !== "done");
    bar.firstElementChild.style.width = (job.status === "done" ? 100 : job.percent || 0) + "%";
    $("phase").textContent = job.phase || "";
    $("phase").classList.toggle("done", job.status === "done");
    const extra = job.status === "downloading"
      ? [job.percent ? job.percent.toFixed(0) + "%" : "", fmtSpeed(job.speed)].filter(Boolean).join(" · ")
      : "";
    $("pct").textContent = extra;
  }

  function poll(jobId) {
    clearInterval(state.polling);
    state.polling = setInterval(async () => {
      try {
        const job = await api(`/api/progress/${jobId}`);
        setProgress(job);
        if (job.status === "done") {
          clearInterval(state.polling);
          state.jobId = jobId;
          if (state.desktop) {
            $("progress").style.display = "none";
            $("savedName").textContent = job.saved_name || "";
            $("saved").style.display = "block";
          } else {
            window.location.href = `/api/file/${jobId}`;
          }
          $("go").disabled = false;
          $("go").textContent = "Baixar de novo";
        } else if (job.status === "error") {
          clearInterval(state.polling);
          showError(job.error);
          $("progress").style.display = "none";
          $("go").disabled = false;
        }
      } catch (err) {
        clearInterval(state.polling);
        showError(err.message);
        $("go").disabled = false;
      }
    }, 700);
  }
</script>
</body>
</html>
