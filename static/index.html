<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Downme</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e0f13;
      --card: #171920;
      --field: #0f1116;
      --border: #262935;
      --text: #eceef4;
      --muted: #8b90a0;
      --accent: #ff3d57;
      --accent-2: #ff7a45;
      --ok: #34d399;
      --err: #f87171;
      --warn: #fbbf24;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 50% -200px, #2a1520 0%, var(--bg) 60%) var(--bg);
      color: var(--text);
      display: flex; justify-content: center; padding: 48px 16px;
    }
    main { width: 100%; max-width: 780px; }
    header { text-align: center; margin-bottom: 28px; }
    .logo {
      font-size: 42px; font-weight: 700; letter-spacing: -1.5px; margin: 0;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    header p { color: var(--muted); margin: 8px 0 0; }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
    }
    .card + .card { margin-top: 16px; }

    textarea, select {
      font: inherit; color: var(--text); background: var(--field);
      border: 1px solid var(--border); border-radius: 12px; outline: none;
      transition: border-color .15s;
    }
    textarea {
      width: 100%; padding: 14px 16px; resize: vertical; min-height: 54px; max-height: 260px;
      display: block; line-height: 1.45;
    }
    textarea:focus, select:focus { border-color: var(--accent); }
    select { padding: 8px 10px; font-size: 14px; cursor: pointer; }
    select:disabled { opacity: .5; cursor: not-allowed; }

    button {
      font: inherit; font-weight: 600; cursor: pointer; border: 0;
      border-radius: 12px; padding: 12px 18px; color: #fff;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: opacity .15s, transform .05s, border-color .15s;
    }
    button:hover { opacity: .92; }
    button:active { transform: scale(.98); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    button.ghost:hover { border-color: #3a3e4d; opacity: 1; }
    button.sm { padding: 7px 11px; font-size: 13px; font-weight: 500; border-radius: 10px; }
    button.icon { padding: 7px 9px; min-width: 32px; line-height: 1; }

    .add-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
    .add-row .spacer { flex: 1; }
    .seg { display: flex; gap: 6px; }
    .seg button {
      background: var(--field); border: 1px solid var(--border); color: var(--text);
      padding: 8px 12px; font-weight: 500; font-size: 14px; border-radius: 10px;
    }
    .seg button.active { border-color: var(--accent); background: #2a1520; }
    .field-label { font-size: 13px; color: var(--muted); }
    .msg { margin-top: 10px; font-size: 14px; color: var(--err); min-height: 1em; }
    .msg.info { color: var(--muted); }

    /* --- fila --- */
    .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .toolbar h2 { font-size: 16px; margin: 0; }
    .toolbar .counts { color: var(--muted); font-size: 13px; }
    .toolbar .spacer { flex: 1; }
    .toolbar label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
    .paused-banner {
      display: none; margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: 13px;
      background: rgba(251, 191, 36, .08); border: 1px solid rgba(251, 191, 36, .3); color: var(--warn);
    }

    #list { margin-top: 14px; display: grid; gap: 10px; }
    .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 28px 8px; }

    .item {
      display: grid; grid-template-columns: 120px 1fr; gap: 14px;
      padding: 12px; border-radius: 12px; background: var(--field); border: 1px solid var(--border);
    }
    .item.active { border-color: rgba(255, 61, 87, .45); }
    .item.held { opacity: .7; }
    .thumb {
      width: 120px; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px;
      background: #1c1f28; display: block;
    }
    .body { min-width: 0; display: grid; gap: 8px; align-content: start; }
    .head { display: flex; gap: 10px; align-items: flex-start; }
    .titles { flex: 1; min-width: 0; }
    .title {
      font-size: 14px; font-weight: 600; line-height: 1.35; margin: 0;
      overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word;
    }
    .sub { font-size: 12px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pos { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }

    .chip {
      font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 99px; white-space: nowrap;
      border: 1px solid var(--border); color: var(--muted);
    }
    .chip.downloading, .chip.processing { color: var(--accent-2); border-color: rgba(255, 122, 69, .4); }
    .chip.done { color: var(--ok); border-color: rgba(52, 211, 153, .4); }
    .chip.error { color: var(--err); border-color: rgba(248, 113, 113, .4); }
    .chip.held { color: var(--warn); border-color: rgba(251, 191, 36, .4); }

    .controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .controls .spacer { flex: 1; }

    .bar { height: 6px; background: #1c1f28; border-radius: 99px; overflow: hidden; }
    .bar > div {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width .3s;
    }
    .bar.indeterminate > div { width: 40%; animation: slide 1.2s infinite ease-in-out; }
    @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
    .progress-info { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 6px; }

    .note { font-size: 13px; word-break: break-word; }
    .note.err { color: var(--err); }
    .note.ok { color: var(--muted); }
    .note.ok strong { color: var(--ok); font-weight: 600; }

    footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; line-height: 1.7; }
    footer a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--border); }
    footer a:hover { border-color: var(--accent); }
    .gh { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 13px; }
    .gh svg { width: 15px; height: 15px; fill: currentColor; }

    .update {
      display: none; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px;
      padding: 12px 14px; border-radius: 12px; font-size: 14px;
      background: rgba(52, 211, 153, .08); border: 1px solid rgba(52, 211, 153, .3);
    }
    .update .txt { flex: 1; min-width: 200px; }
    .update strong { color: var(--ok); }
    .update small { display: block; color: var(--muted); margin-top: 2px; }
    .version { margin-top: 6px; }
    .version button.link {
      background: none; border: 0; padding: 0; color: var(--muted); font: inherit; font-weight: 400;
      text-decoration: underline; text-underline-offset: 2px; cursor: pointer;
    }
    .version button.link:hover { color: var(--text); opacity: 1; }

    .spinner {
      display: inline-block; width: 12px; height: 12px; vertical-align: -1px;
      border: 2px solid rgba(255,255,255,.25); border-top-color: var(--muted);
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 560px) {
      body { padding: 28px 16px; }
      .item { grid-template-columns: 1fr; }
      .thumb { width: 100%; }
      .add-row #add { width: 100%; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1 class="logo">Downme</h1>
    <p>Cole um ou vários links do YouTube — eles entram na fila e baixam em sequência.</p>
  </header>

  <div class="update" id="updateBox">
    <div class="txt">
      <strong id="updateTitle"></strong>
      <small id="updateSub"></small>
    </div>
    <button type="button" class="sm" id="restartBtn">Reiniciar agora</button>
  </div>

  <section class="card">
    <form id="addForm">
      <textarea id="urls" rows="2" placeholder="https://www.youtube.com/watch?v=...&#10;(um ou mais links, um por linha)" autocomplete="off" spellcheck="false"></textarea>
      <div class="add-row">
        <span class="field-label">Padrão:</span>
        <div class="seg" id="defKind">
          <button type="button" data-kind="video" class="active">Vídeo (MP4)</button>
          <button type="button" data-kind="audio">Só áudio (MP3)</button>
        </div>
        <select id="defQuality" aria-label="Qualidade padrão">
          <option value="">Melhor qualidade</option>
          <option value="2160">até 2160p (4K)</option>
          <option value="1440">até 1440p</option>
          <option value="1080">até 1080p</option>
          <option value="720">até 720p</option>
          <option value="480">até 480p</option>
          <option value="360">até 360p</option>
        </select>
        <span class="spacer"></span>
        <button id="add" type="submit">Adicionar à fila</button>
      </div>
    </form>
    <div class="msg" id="msg"></div>
  </section>

  <section class="card">
    <div class="toolbar">
      <h2>Fila</h2>
      <span class="counts" id="counts"></span>
      <span class="spacer"></span>
      <label>Simultâneos
        <select id="concurrency" aria-label="Downloads simultâneos"></select>
      </label>
      <button type="button" class="ghost sm" id="pauseBtn">Pausar fila</button>
      <button type="button" class="ghost sm" id="clearBtn">Limpar concluídos</button>
    </div>
    <div class="paused-banner" id="pausedBanner">Fila pausada — o que já está baixando termina, mas nada novo começa.</div>
    <div id="list"></div>
  </section>

  <footer>
    <span id="saveDir"></span>
    Uso pessoal. Baixe apenas vídeos seus, de domínio público ou com permissão do autor.
    <div>
      <a class="gh" href="https://github.com/nobackslash/Downme" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        Downme no GitHub · @nobackslash
      </a>
    </div>
    <div class="version" id="versionLine" hidden>
      <span id="versionText"></span> · <button type="button" class="link" id="checkBtn">Verificar atualizações</button>
    </div>
  </footer>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const state = {
    desktop: false,
    kind: "video",
    items: [],
    settings: { concurrency: 1, paused: false },
    rows: new Map(),       // id -> { el, html }
    order: "",
    seenDone: null,        // ids já prontos (modo site: baixa só os novos)
    timer: null,
  };

  const STATUS_LABEL = {
    fetching: "Buscando", queued: "Na fila", downloading: "Baixando",
    processing: "Finalizando", done: "Pronto", error: "Erro", canceled: "Cancelado",
  };
  const ACTIVE = ["downloading", "processing"];
  const EDITABLE = ["fetching", "queued", "error", "canceled"];

  // ---------- utilidades ----------
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
  function fmtDuration(s) {
    if (!s) return "";
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
    const mm = String(m).padStart(h ? 2 : 1, "0"), ss = String(sec).padStart(2, "0");
    return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
  }
  function fmtSpeed(b) {
    if (!b) return "";
    return b > 1048576 ? (b / 1048576).toFixed(1) + " MB/s" : (b / 1024).toFixed(0) + " KB/s";
  }
  function fmtEta(s) { return s ? "falta " + fmtDuration(s) : ""; }
  function showMsg(text, info = false) {
    $("msg").textContent = text || "";
    $("msg").classList.toggle("info", info);
  }
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  async function api(path, body, method) {
    const opts = body !== undefined || method ? {
      method: method || "POST", headers: { "Content-Type": "application/json" },
      body: body !== undefined ? JSON.stringify(body) : undefined,
    } : undefined;
    const res = await fetch(path, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Erro inesperado.");
    return data;
  }

  // ---------- padrões de novos itens ----------
  function setDefKind(kind) {
    state.kind = kind;
    [...$("defKind").children].forEach((x) => x.classList.toggle("active", x.dataset.kind === kind));
    $("defQuality").style.display = kind === "audio" ? "none" : "";
    store.set("downme.kind", kind);
  }
  $("defKind").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (b) setDefKind(b.dataset.kind);
  });
  $("defQuality").addEventListener("change", () => store.set("downme.quality", $("defQuality").value));
  setDefKind(store.get("downme.kind") === "audio" ? "audio" : "video");
  const savedQ = store.get("downme.quality");
  if (savedQ !== null && [...$("defQuality").options].some((o) => o.value === savedQ)) $("defQuality").value = savedQ;

  // ---------- adicionar ----------
  $("addForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const urls = $("urls").value.split(/\s+/).map((s) => s.trim()).filter(Boolean);
    if (!urls.length) { showMsg("Cole pelo menos um link."); return; }
    const btn = $("add");
    btn.disabled = true;
    try {
      const res = await api("/api/queue", {
        urls, kind: state.kind, quality: state.kind === "audio" ? null : ($("defQuality").value || null),
      });
      const parts = [`${res.added.length} adicionado${res.added.length === 1 ? "" : "s"} à fila.`];
      if (res.skipped) parts.push(`${res.skipped} já estava${res.skipped === 1 ? "" : "m"} na fila.`);
      if (res.invalid.length) parts.push(`${res.invalid.length} link${res.invalid.length === 1 ? "" : "s"} inválido${res.invalid.length === 1 ? "" : "s"} ignorado${res.invalid.length === 1 ? "" : "s"}.`);
      showMsg(parts.join(" "), !res.invalid.length);
      $("urls").value = res.invalid.join("\n");
      refresh();
    } catch (err) {
      showMsg(err.message);
    } finally {
      btn.disabled = false;
      $("urls").focus();
    }
  });
  // Enter adiciona; Shift+Enter quebra linha.
  $("urls").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("addForm").requestSubmit(); }
  });

  // ---------- controles da fila ----------
  $("pauseBtn").addEventListener("click", () => applyQueue(api("/api/settings", { paused: !state.settings.paused })));
  $("clearBtn").addEventListener("click", () => applyQueue(api("/api/queue/clear", {})));
  $("concurrency").addEventListener("change", () =>
    applyQueue(api("/api/settings", { concurrency: Number($("concurrency").value) })));

  async function applyQueue(promise) {
    try { render(await promise); } catch (err) { showMsg(err.message); }
  }

  // Ações por item (delegação: os elementos são recriados a cada mudança).
  $("list").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-act]"); if (!b) return;
    const id = b.closest(".item").dataset.id;
    const it = state.items.find((x) => x.id === id); if (!it) return;
    const act = b.dataset.act;
    const base = `/api/queue/${id}`;
    if (act === "up" || act === "down" || act === "top") applyQueue(api(`${base}/move`, { dir: act }));
    else if (act === "hold") applyQueue(api(base, { hold: !it.hold }, "PATCH"));
    else if (act === "remove") applyQueue(api(base, undefined, "DELETE"));
    else if (act === "cancel") applyQueue(api(`${base}/cancel`, {}));
    else if (act === "retry") applyQueue(api(`${base}/retry`, {}));
    else if (act === "file" || act === "folder") api(`/api/open/${id}`, { what: act }).catch((err) => showMsg(err.message));
    else if (act === "save") saveFile(id);
  });
  $("list").addEventListener("change", (e) => {
    const sel = e.target.closest("select[data-field]"); if (!sel) return;
    const id = sel.closest(".item").dataset.id;
    const value = sel.dataset.field === "quality" ? (sel.value || null) : sel.value;
    applyQueue(api(`/api/queue/${id}`, { [sel.dataset.field]: value }, "PATCH"));
  });

  function saveFile(id) {
    const a = document.createElement("a");
    a.href = `/api/file/${id}`; a.download = "";
    document.body.appendChild(a); a.click(); a.remove();
  }

  // ---------- renderização ----------
  function qualityOptions(it) {
    // Enquanto busca info, só existe a qualidade escolhida; depois, as do vídeo.
    const opts = [`<option value="">Melhor</option>`];
    const all = [...new Set([...(it.qualities || []), ...(it.quality ? [it.quality] : [])])].sort((a, b) => b - a);
    for (const h of all) opts.push(`<option value="${h}"${h === it.quality ? " selected" : ""}>${h}p</option>`);
    return opts.join("");
  }

  function itemHtml(it, pos) {
    const active = ACTIVE.includes(it.status);
    const editable = EDITABLE.includes(it.status);
    const waiting = it.status === "queued" || it.status === "fetching";
    const chipCls = it.hold && waiting ? "held" : it.status;
    const chipText = it.hold && waiting ? "Segurado" : STATUS_LABEL[it.status];
    const title = it.title || it.url;
    const sub = [it.channel, fmtDuration(it.duration)].filter(Boolean).join(" · ")
      || (it.status === "fetching" ? '<span class="spinner"></span> buscando informações…' : "");

    let middle = "";
    if (active) {
      const indet = it.status === "processing" || !it.percent;
      const extra = it.status === "downloading"
        ? [it.percent ? it.percent.toFixed(0) + "%" : "", fmtSpeed(it.speed), fmtEta(it.eta)].filter(Boolean).join(" · ")
        : "";
      middle = `
        <div>
          <div class="bar${indet ? " indeterminate" : ""}"><div style="width:${indet ? 40 : it.percent}%"></div></div>
          <div class="progress-info"><span>${esc(it.phase)}</span><span>${esc(extra)}</span></div>
        </div>`;
    } else if (it.status === "done") {
      middle = `<div class="note ok"><strong>Salvo</strong> ${esc(it.saved_name || "")}</div>`;
    } else if (it.status === "error") {
      middle = `<div class="note err">${esc(it.error)}</div>`;
    }

    const kindSel = `
      <select data-field="kind" aria-label="Formato"${editable ? "" : " disabled"}>
        <option value="video"${it.kind === "video" ? " selected" : ""}>MP4</option>
        <option value="audio"${it.kind === "audio" ? " selected" : ""}>MP3</option>
      </select>`;
    const qualSel = it.kind === "video" ? `
      <select data-field="quality" aria-label="Qualidade"${editable ? "" : " disabled"}>${qualityOptions(it)}</select>` : "";

    let buttons = "";
    if (editable) {
      buttons += `
        <button type="button" class="ghost sm icon" data-act="top" title="Mover para o topo">⤒</button>
        <button type="button" class="ghost sm icon" data-act="up" title="Subir">↑</button>
        <button type="button" class="ghost sm icon" data-act="down" title="Descer">↓</button>`;
    }
    if (waiting) buttons += `<button type="button" class="ghost sm" data-act="hold">${it.hold ? "Liberar" : "Segurar"}</button>`;
    if (it.status === "error" || it.status === "canceled") buttons += `<button type="button" class="sm" data-act="retry">Tentar de novo</button>`;
    if (active) buttons += `<button type="button" class="ghost sm" data-act="cancel">Cancelar</button>`;
    if (it.status === "done") {
      buttons += state.desktop
        ? `<button type="button" class="sm" data-act="file">Abrir</button>
           <button type="button" class="ghost sm" data-act="folder">Mostrar na pasta</button>`
        : `<button type="button" class="sm" data-act="save">Salvar</button>`;
    }
    const removeTitle = active ? "Cancelar e tirar da fila" : "Tirar da lista";
    buttons += `<button type="button" class="ghost sm icon" data-act="remove" title="${removeTitle}">✕</button>`;

    return `
      ${it.thumbnail ? `<img class="thumb" src="${esc(it.thumbnail)}" alt="">` : `<div class="thumb"></div>`}
      <div class="body">
        <div class="head">
          <span class="pos">${pos}</span>
          <div class="titles">
            <p class="title" title="${esc(title)}">${esc(title)}</p>
            <div class="sub">${sub}</div>
          </div>
          <span class="chip ${chipCls}">${esc(chipText)}</span>
        </div>
        ${middle}
        <div class="controls">${it.status === "done" ? "" : kindSel + qualSel}<span class="spacer"></span>${buttons}</div>
      </div>`;
  }

  function render(data) {
    state.items = data.items;
    state.settings = data.settings;

    // modo site: quando um item fica pronto, o navegador baixa sozinho
    const doneIds = data.items.filter((x) => x.status === "done").map((x) => x.id);
    if (state.seenDone === null) state.seenDone = new Set(doneIds);
    for (const id of doneIds) {
      if (!state.seenDone.has(id)) { state.seenDone.add(id); if (!state.desktop) saveFile(id); }
    }

    // barra de ferramentas
    const c = { wait: 0, run: 0, done: 0, err: 0 };
    for (const it of data.items) {
      if (it.status === "queued" || it.status === "fetching") c.wait++;
      else if (ACTIVE.includes(it.status)) c.run++;
      else if (it.status === "done") c.done++;
      else c.err++;
    }
    $("counts").textContent = [
      c.run && `${c.run} baixando`, c.wait && `${c.wait} esperando`,
      c.done && `${c.done} pronto${c.done === 1 ? "" : "s"}`, c.err && `${c.err} com erro/cancelado${c.err === 1 ? "" : "s"}`,
    ].filter(Boolean).join(" · ");
    $("pauseBtn").textContent = data.settings.paused ? "Retomar fila" : "Pausar fila";
    $("pausedBanner").style.display = data.settings.paused ? "block" : "none";
    $("clearBtn").disabled = !(c.done || c.err);
    if (document.activeElement !== $("concurrency")) $("concurrency").value = String(data.settings.concurrency);

    // lista — só recria a linha que mudou, e nunca a que está com um select em foco
    const list = $("list");
    const live = new Set();
    data.items.forEach((it, i) => {
      live.add(it.id);
      const html = itemHtml(it, i + 1);
      let row = state.rows.get(it.id);
      if (!row) {
        const el = document.createElement("div");
        el.className = "item"; el.dataset.id = it.id;
        row = { el, html: null };
        state.rows.set(it.id, row);
      }
      if (row.html !== html && !row.el.contains(document.activeElement)) {
        row.el.innerHTML = html; row.html = html;
      }
      row.el.classList.toggle("active", ACTIVE.includes(it.status));
      row.el.classList.toggle("held", it.hold && (it.status === "queued" || it.status === "fetching"));
    });
    for (const [id, row] of state.rows) {
      if (!live.has(id)) { row.el.remove(); state.rows.delete(id); }
    }
    const orderKey = data.items.map((x) => x.id).join(",");
    if (orderKey !== state.order) {
      state.order = orderKey;
      data.items.forEach((it) => list.appendChild(state.rows.get(it.id).el));
    }
    let empty = list.querySelector(".empty");
    if (!data.items.length && !empty) {
      empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "A fila está vazia. Cole links acima para começar.";
      list.appendChild(empty);
    } else if (data.items.length && empty) {
      empty.remove();
    }
  }

  // ---------- atualização automática (só no app) ----------
  function renderUpdate(u) {
    const ready = u.status === "ready";
    $("updateBox").style.display = ready ? "flex" : "none";
    if (ready) {
      const busy = state.items.some((x) => ACTIVE.includes(x.status));
      $("updateTitle").textContent = `Downme ${u.latest} já foi baixado.`;
      $("updateSub").textContent = busy
        ? "Instala sozinho quando você fechar o app. Se reiniciar agora, os downloads em andamento recomeçam do zero."
        : "Instala sozinho quando você fechar o app — ou reinicie agora.";
    }
    const status = {
      checking: "procurando…", downloading: `baixando atualização ${u.percent || 0}%`,
      latest: "você está na versão mais recente", error: u.error, ready: "atualização pronta",
    }[u.status];
    $("versionText").textContent = `Downme ${u.current}` + (status ? ` — ${status}` : "");
    $("checkBtn").disabled = ["checking", "downloading", "ready"].includes(u.status);
  }
  async function pollUpdate() {
    try { renderUpdate(await api("/api/update")); } catch {}
  }
  $("checkBtn").addEventListener("click", async () => {
    try { renderUpdate(await api("/api/update/check", {})); } catch {}
    setTimeout(pollUpdate, 800);
  });
  $("restartBtn").addEventListener("click", async () => {
    $("restartBtn").disabled = true;
    $("restartBtn").textContent = "Reiniciando…";
    try { await api("/api/update/restart", {}); }
    catch (err) { showMsg(err.message); $("restartBtn").disabled = false; $("restartBtn").textContent = "Reiniciar agora"; }
  });

  // ---------- polling ----------
  async function refresh() {
    clearTimeout(state.timer);
    try { render(await api("/api/queue")); } catch {}
    const busy = state.items.some((x) => !["done", "error", "canceled"].includes(x.status));
    state.timer = setTimeout(refresh, busy ? 700 : 2500);
  }

  fetch("/api/config").then((r) => r.json()).then((cfg) => {
    state.desktop = !!cfg.desktop;
    if (cfg.save_dir) $("saveDir").innerHTML = `Arquivos salvos em <b>${esc(cfg.save_dir)}</b><br>`;
    const sel = $("concurrency");
    for (let n = 1; n <= (cfg.max_concurrency || 4); n++) sel.add(new Option(String(n), String(n)));
    sel.value = String(state.settings.concurrency);
    state.rows.forEach((row) => { row.html = null; });  // re-renderiza botões do modo app
    if (state.desktop) {
      $("versionLine").hidden = false;
      pollUpdate();
      setInterval(pollUpdate, 4000);
    }
  }).catch(() => {}).finally(refresh);
</script>
</body>
</html>
